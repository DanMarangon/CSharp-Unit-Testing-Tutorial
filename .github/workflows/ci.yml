name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build e testes (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o SDK do .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restaurar dependências
        run: dotnet restore src/UnitTestingTutorial.slnx

      - name: Compilar
        run: dotnet build src/UnitTestingTutorial.slnx --no-restore --configuration Release

      - name: Executar testes com cobertura
        run: >
          dotnet test src/UnitTestingTutorial.slnx
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Separar o arquivo de cobertura
        run: |
          mkdir -p cobertura
          cp "$(find TestResults -name coverage.cobertura.xml | head -n 1)" cobertura/coverage.cobertura.xml

      - name: Publicar cobertura como artefato
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-cobertura-xml
          path: cobertura/coverage.cobertura.xml
